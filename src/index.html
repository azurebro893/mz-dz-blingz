<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mz D'z Dazzlin Blingz N Thingz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="home">
        <img src="assets/logo.jpg" alt="Mz D'z Logo" class="main-logo">
        <h1>Mz D'z Dazzlin Blingz N Thingz</h1>
        <nav>
            <a href="#shop">Shop Gear</a>
            <a href="#checkout">Checkout</a>
        </nav>
    </header>

    <section id="shop">
        <h2>Exclusive Bling Collections</h2>
        <div class="product-grid">
            <div class="product-card">
                <h3>Detroit Lions Bling</h3>
                <button onclick="openOrder('Detroit Lions Bling')">Select Options</button>
            </div>
            <div class="product-card">
                <h3>Detroit Pistons 313 Bling</h3>
                <button onclick="openOrder('Detroit Pistons 313 Bling')">Select Options</button>
            </div>
            <div class="product-card">
                <h3>Mother's Day Mom Bling</h3>
                <button onclick="openOrder('Mothers Day Mom Bling')">Select Options</button>
            </div>
            <div class="product-card">
                <h3>Dodgers Bling</h3>
                <button onclick="openOrder('Dodgers Bling')">Select Options</button>
            </div>
        </div>
    </section>

    <section id="order-form" style="display:none;">
        <h2 id="selected-item">Product Name</h2>
        <select id="gender">
            <option value="Mens">Men's</option>
            <option value="Womens">Women's</option>
        </select>
        <select id="size">
            <option value="S">Small</option>
            <option value="M">Medium</option>
            <option value="L">Large</option>
            <option value="XL">XL</option>
        </select>
        <button onclick="goToCheckout()">Add to Cart</button>
    </section>

    <section id="checkout">
        <h2>Secure Checkout</h2>
        <p>Accepted Payments:</p>
        <div class="payment-icons">
            <span>PayPal | Venmo | Visa | Mastercard | Cash App</span>
        </div>
        <div id="paypal-button-container"></div> </section>

    <script src="script.js"></script>
</body>
</html>
